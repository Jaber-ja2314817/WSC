# Packaging for WSC. Builds are unsigned for now; see .github/workflows/release.yml for where
# signing/notarization secrets plug in later.
appId: io.github.owner.wsc
productName: WSC
copyright: Copyright © 2026 WSC contributors
directories:
  # build/icon.png (≥ 512×512) is picked up automatically when present.
  buildResources: build
  output: dist
files:
  - out/**
  - resources/**
  - package.json
  # Main and preload may import only node:* and electron (tests/bundle.test.ts). A runtime
  # dependency of main must be listed in build.externalizeDeps.exclude in electron.vite.config.ts.
  - '!node_modules/**'
# Ship the Claude Code plugin inside the app so the manual hook install can point at it.
extraResources:
  - from: plugin
    to: plugin
    filter: ['**/*']
asarUnpack:
  - resources/**
artifactName: ${productName}-${version}-${os}-${arch}.${ext}

mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.developer-tools
  identity: null
  notarize: false
  hardenedRuntime: false
dmg:
  writeUpdateInfo: false

win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  differentialPackage: false

linux:
  target: [AppImage]
  category: Development
  synopsis: Watch Claude Code agents work on a pixel-art station

publish:
  provider: github
  owner: Jaber-ja2314817
  repo: WSC
  releaseType: draft
